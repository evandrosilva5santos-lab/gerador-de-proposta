<style>
  /* ===== Tema Dark / Neon — override do design system START INC ===== */
  :root, [data-plat-theme="dark"]{
    --font-display:'Chakra Petch',sans-serif;
    --font-body:'Chakra Petch',sans-serif;

    --color-bg:#01050c;
    --color-bg-subtle:#04070e;
    --color-surface:#0a0f18;
    --color-surface-2:#04070e;

    --color-dark:#f1fcff;
    --color-text:#f1fcff;
    --color-text-muted:#9fb2c9;
    --color-text-on-dark-muted:rgba(255,255,255,.6);

    --color-border:rgba(255,255,255,.10);
    --color-border-dark:rgba(255,255,255,.08);

    --color-primary:#ff2fd0;
    --color-primary-hover:#ff7a00;
    --color-primary-press:#d81ea9;
    --color-primary-tint:rgba(255,47,208,.16);
    --sky-300:#00d1ff;
    --color-success:#2ee6a8;

    --gradient-brand:linear-gradient(90deg,#ff7a00 0%,#ff00f5 100%);
    --shadow-card:0 10px 30px rgba(0,0,0,.45);
    --shadow-card-hover:0 18px 44px rgba(0,0,0,.6);
    --shadow-xl:0 30px 80px rgba(0,0,0,.6);
    --shadow-focus:0 0 0 3px rgba(255,47,208,.28);
  }
  [data-plat-theme="light"]{
    --font-display:'Poppins',sans-serif;
    --font-body:'Rubik',sans-serif;

    --color-bg:#ffffff;
    --color-bg-subtle:#f8f8f8;
    --color-surface:#ffffff;
    --color-surface-2:#f8f8f8;

    --color-dark:#1d274e;
    --color-text:#292929;
    --color-text-muted:#5b6472;
    --color-text-on-dark-muted:#5b6472;

    --color-border:#e4e9f0;
    --color-border-dark:#d3dce8;

    --color-primary:#0093e0;
    --color-primary-hover:#0084c9;
    --color-primary-press:#054b8d;
    --color-primary-tint:rgba(0,147,224,.12);
    --sky-300:#0093e0;
    --color-success:#22c55e;

    --gradient-brand:linear-gradient(90deg,#0093e0,#0c5cb8);
    --shadow-card:0 10px 30px rgba(10,25,60,.08);
    --shadow-card-hover:0 18px 44px rgba(10,25,60,.12);
    --shadow-xl:0 30px 80px rgba(10,25,60,.12);
    --shadow-focus:0 0 0 3px rgba(0,147,224,.16);
  }
  html,body{margin:0;background:var(--color-bg);color:var(--color-text);transition:background .3s,color .3s}
  a{color:var(--sky-300)}a:hover{opacity:.8}
  input[type="checkbox"]{margin:0}
  ::selection{background:var(--color-primary-tint)}
  input::placeholder,textarea::placeholder{color:var(--color-text-muted)}
  select option{background:var(--color-surface);color:var(--color-text)}
</style>
